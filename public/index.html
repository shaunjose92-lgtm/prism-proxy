<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cipher Browser</title>
<style>
  :root { --bg:#080a12; --glass:rgba(255,255,255,.07); --glass-hi:rgba(255,255,255,.13); --line:rgba(255,255,255,.14); --text:#eef0fb; --muted:#9aa1bf; --accent:#8b7bff; --accent2:#4fd1ff; }
  @media (prefers-color-scheme: light) {
    :root { --bg:#eef0fa; --glass:rgba(255,255,255,.6); --glass-hi:rgba(255,255,255,.9); --line:rgba(30,35,70,.12); --text:#151830; --muted:#5d6385; --accent:#5b4bf0; --accent2:#0b9fd6; }
  }
  * { box-sizing: border-box; }
  html, body { margin:0; min-height:100%; }
  body { min-height:100vh; display:grid; place-items:center; padding:2rem 1rem; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; overflow-x:hidden; position:relative; }
  .blob { position:fixed; border-radius:50%; filter:blur(80px); opacity:.45; z-index:0; pointer-events:none; animation:float 18s ease-in-out infinite alternate; }
  .b1 { width:42vmax; height:42vmax; background:var(--accent); top:-14vmax; left:-10vmax; }
  .b2 { width:36vmax; height:36vmax; background:var(--accent2); bottom:-14vmax; right:-8vmax; animation-delay:-6s; }
  @keyframes float { to { transform:translate(4vmax,3vmax) scale(1.08); } }
  @media (prefers-reduced-motion: reduce) { .blob { animation:none; } }
  main { position:relative; z-index:1; width:min(680px,100%); text-align:center; }
  .brand { display:inline-flex; align-items:center; gap:.6rem; font-weight:700; letter-spacing:.02em; color:var(--muted); margin-bottom:1.2rem; }
  .logo { width:30px; height:30px; border-radius:10px; background:linear-gradient(135deg,var(--accent),var(--accent2)); box-shadow:0 4px 16px color-mix(in srgb,var(--accent) 50%,transparent); }
  h1 { font-size:clamp(2rem,6vw,3.2rem); margin:0 0 .4rem; letter-spacing:-.03em; line-height:1.1; }
  p.sub { color:var(--muted); margin:0 0 1.8rem; }
  form { display:flex; gap:.5rem; padding:.5rem; border-radius:20px; background:var(--glass); border:1px solid var(--line); backdrop-filter:blur(22px) saturate(160%); -webkit-backdrop-filter:blur(22px) saturate(160%); box-shadow:0 12px 44px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.12); }
  form:focus-within { border-color:var(--accent); }
  input { flex:1; min-width:0; border:0; background:transparent; color:var(--text); font-size:1.02rem; padding:.85rem 1rem; outline:none; }
  input::placeholder { color:var(--muted); }
  button.go { border:0; border-radius:14px; padding:0 1.5rem; background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; font-weight:700; font-size:1rem; cursor:pointer; }
  button.go:hover { filter:brightness(1.1); }
  .label { text-align:left; color:var(--muted); font-size:.8rem; letter-spacing:.08em; text-transform:uppercase; margin:2rem 0 .7rem .3rem; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(92px,1fr)); gap:.7rem; }
  .tile { display:flex; flex-direction:column; align-items:center; gap:.5rem; padding:.9rem .4rem; border-radius:18px; text-decoration:none; color:var(--text); font-size:.86rem; background:var(--glass); border:1px solid var(--line); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); transition:transform .15s, background .15s, border-color .15s; }
  .tile:hover { transform:translateY(-3px); background:var(--glass-hi); border-color:var(--accent); }
  .ico { width:42px; height:42px; border-radius:13px; display:grid; place-items:center; color:#fff; font-weight:800; font-size:1.1rem; box-shadow:0 4px 14px rgba(0,0,0,.25); }
  small { display:block; margin-top:1.8rem; color:var(--muted); font-size:.82rem; }
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div>
<main>
  <div class="brand"><span class="logo"></span>Cipher Browser</div>
  <h1 id="hello">Welcome</h1>
  <p class="sub">Search with DuckDuckGo or type a web address.</p>

  <form id="f">
    <input id="q" placeholder="Search or enter a URL" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus>
    <button class="go">Go</button>
  </form>

  <div class="label">Social</div>
  <div class="grid">
    <a class="tile" href="#" data-u="https://www.instagram.com"><span class="ico" style="background:linear-gradient(45deg,#f9a03f,#e1306c,#833ab4)">Ig</span>Instagram</a>
    <a class="tile" href="#" data-u="https://www.tiktok.com"><span class="ico" style="background:#111;border:1px solid #333">Tk</span>TikTok</a>
    <a class="tile" href="#" data-u="https://www.youtube.com"><span class="ico" style="background:#ff0033">Yt</span>YouTube</a>
    <a class="tile" href="#" data-u="https://x.com"><span class="ico" style="background:#000;border:1px solid #333">X</span>X</a>
    <a class="tile" href="#" data-u="https://www.reddit.com"><span class="ico" style="background:#ff4500">Rd</span>Reddit</a>
    <a class="tile" href="#" data-u="https://discord.com/app"><span class="ico" style="background:#5865f2">Dc</span>Discord</a>
    <a class="tile" href="#" data-u="https://www.snapchat.com"><span class="ico" style="background:#f7d600;color:#111">Sc</span>Snapchat</a>
  </div>

  <div class="label">Games</div>
  <div class="grid">
    <a class="tile" href="#" data-u="https://www.crazygames.com"><span class="ico" style="background:linear-gradient(135deg,#7b4dff,#c94bff)">Cg</span>CrazyGames</a>
  </div>

  <small>Works best on simple sites. Big apps and games may load slowly or not at all.</small>
</main>
<script>
  (function () {
    var h = new Date().getHours();
    var g = h < 5 ? 'Up late?' : h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
    document.getElementById('hello').textContent = g + ', welcome to Cipher';
  })();
  function go(v) {
    v = (v || '').trim(); if (!v) return;
    var url;
    if (/^https?:\/\//i.test(v)) url = v;
    else if (/^[\w-]+(\.[\w-]+)+(:\d+)?(\/.*)?$/.test(v)) url = 'https://' + v;
    else url = 'https://html.duckduckgo.com/html/?q=' + encodeURIComponent(v);
    location.href = '/p/' + encodeURIComponent(url);
  }
  document.getElementById('f').addEventListener('submit', function (e) { e.preventDefault(); go(document.getElementById('q').value); });
  document.querySelectorAll('.tile').forEach(function (a) {
    a.addEventListener('click', function (e) { e.preventDefault(); go(a.dataset.u); });
  });
</script>
</body>
</html>
